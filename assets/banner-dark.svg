  <title>hello, world</title>
  <style>
    .grid line { stroke: #1b2a52; stroke-width: 1; opacity: .35; }
    .contours path { fill: none; stroke: #22346b; stroke-width: 1.2; opacity: .6; animation: drift 14s ease-in-out infinite alternate; }
    .routes path { fill: none; stroke: #334a8f; stroke-width: 1.3; opacity: .6; }
    .flows path { fill: none; stroke: #5eead4; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 3 30; animation: flow 3s linear infinite; }
    .node { fill: #818cf8; }
    .hot { fill: #f472b6; }
    .ring { fill: none; stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: ping 2.6s ease-out infinite; }
    .node-ring { stroke: #818cf8; }
    .hot-ring { stroke: #f472b6; animation-duration: 1.9s; }
    .hello { font: 900 84px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -3px; fill: url(#text); }
    .tag { font: 500 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #94a3b8; opacity: 0; animation: cycle 12s infinite; }
    @keyframes flow { to { stroke-dashoffset: -33; } }
    @keyframes ping { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(4.5); opacity: 0; } }
    @keyframes drift { to { transform: translateY(10px); } }
    @keyframes cycle { 0% { opacity: 0; } 3% { opacity: 1; } 22% { opacity: 1; } 25% { opacity: 0; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .flows path, .ring, .contours path { animation: none; }
      .tag { animation: none; }
      .tag:first-of-type { opacity: 1; }
    }
  </style>
