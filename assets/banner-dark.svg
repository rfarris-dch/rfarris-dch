<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="hello, world.">
  <title>hello, world.</title>
  <style>
    .grid line { stroke: #ffffff; stroke-width: 1; opacity: .07; }
    .beams path { fill: none; stroke: #262640; stroke-width: 1; }
    .pulses path { fill: none; stroke: url(#pulse); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 14 86; animation: beam 4s linear infinite; }
    .dots circle { fill: #4f46e5; opacity: .7; }
    .spot { animation: spot 7s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: left center; }
    .spot2 { transform-origin: right center; animation-delay: -3.5s; }
    .meteor { animation: meteor linear infinite; }
    .meteor-head { fill: #e2e8f0; }
    .spark { fill: #ffffff; transform-box: fill-box; transform-origin: center; animation: twinkle ease-in-out infinite; }
    .hello { font: 900 88px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -3.5px; fill: url(#text); }
    .flip { font: 500 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #a3a3a3; opacity: 0; animation: flip 12s infinite; }
    .caret { fill: #5eead4; animation: blink 1s steps(1) infinite; }
    @keyframes beam { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    @keyframes spot { 0% { transform: rotate(-4deg); opacity: .55; } 100% { transform: rotate(4deg); opacity: 1; } }
    @keyframes meteor { 0% { transform: translate(0, 0); opacity: 0; } 8% { opacity: 1; } 70% { opacity: 1; } 100% { transform: translate(-520px, 300px); opacity: 0; } }
    @keyframes twinkle { 0%, 100% { transform: scale(0); opacity: 0; } 50% { transform: scale(1); opacity: .9; } }
    @keyframes flip { 0% { opacity: 0; transform: translateY(10px); } 4% { opacity: 1; transform: translateY(0); } 30% { opacity: 1; transform: translateY(0); } 33% { opacity: 0; transform: translateY(-10px); } 100% { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .flip:first-of-type { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030303" />
      <stop offset="1" stop-color="#0a0a12" />
    </linearGradient>
    <radialGradient id="gridFade" cx=".5" cy=".45" r=".6">
      <stop offset="0" stop-color="#fff" stop-opacity="1" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <mask id="gridMask"><rect width="1200" height="340" fill="url(#gridFade)" /></mask>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#18ccfc" stop-opacity="0" />
      <stop offset=".35" stop-color="#18ccfc" />
      <stop offset=".7" stop-color="#6344f5" />
      <stop offset="1" stop-color="#ae48ff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="meteorTail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2e8f0" stop-opacity=".9" />
      <stop offset="1" stop-color="#e2e8f0" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="spotGrad" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#c7d2fe" stop-opacity=".30" />
      <stop offset=".6" stop-color="#c7d2fe" stop-opacity=".04" />
      <stop offset="1" stop-color="#c7d2fe" stop-opacity="0" />
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24" /></filter>
    <linearGradient id="text" x1="250" y1="0" x2="950" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0" stop-color="#5eead4" />
      <stop offset=".5" stop-color="#818cf8" />
      <stop offset="1" stop-color="#f472b6" />
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;700 0;0 0" dur="10s" repeatCount="indefinite" />
    </linearGradient>
    <radialGradient id="center" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#030303" stop-opacity=".9" />
      <stop offset=".75" stop-color="#030303" stop-opacity=".45" />
      <stop offset="1" stop-color="#030303" stop-opacity="0" />
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="340" rx="20" /></clipPath>
  </defs>
