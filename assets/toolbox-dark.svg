<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64" role="img" aria-label="toolbox">
  <title>toolbox</title>
  <style>
    .run { fill: none; stroke: url(#run); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 22 78; animation: run 3.2s linear infinite; }
    .label { font: 700 22px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: url(#shimmer); letter-spacing: .5px; }
    @keyframes run { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .flip:first-of-type { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="run" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4" />
      <stop offset=".5" stop-color="#818cf8" />
      <stop offset="1" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="120" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0" stop-color="#a3a3a3" />
      <stop offset=".45" stop-color="#a3a3a3" />
      <stop offset=".5" stop-color="#fafafa" />
      <stop offset=".55" stop-color="#a3a3a3" />
      <stop offset="1" stop-color="#a3a3a3" />
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="240 0" dur="3s" repeatCount="indefinite" />
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="256" height="60" rx="30" fill="#0a0a0a" stroke="#262626" stroke-width="1.5" />
  <rect class="run" x="2" y="2" width="256" height="60" rx="30" pathLength="100" />
  <text class="label" x="130.0" y="40.0" text-anchor="middle">🧰  toolbox</text>
</svg>
