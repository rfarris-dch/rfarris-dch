<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180" aria-hidden="true">
  <style>
    .glow { transform-origin: 600px 120px; animation: widen 4s ease-in-out infinite alternate; }
    .bar { transform-origin: 600px 120px; animation: widen 4s ease-in-out infinite alternate; }
    .star { fill: #ffffff; animation: twinkle ease-in-out infinite; }
    @keyframes widen { from { transform: scaleX(.55); opacity: .7; } to { transform: scaleX(1); opacity: 1; } }
    @keyframes twinkle { 0%, 100% { opacity: .1; } 50% { opacity: .8; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .flip:first-of-type { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="cone" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".55" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="14" /></filter>
    <filter id="hard" x="-10%" y="-200%" width="120%" height="500%"><feGaussianBlur stdDeviation="3" /></filter>
  </defs>
  <circle class="star" cx="140" cy="40" r="1.3" style="animation-duration:3.1s;animation-delay:-0.4s" /><circle class="star" cx="260" cy="95" r="1.3" style="animation-duration:2.4s;animation-delay:-1.1s" /><circle class="star" cx="380" cy="30" r="1.3" style="animation-duration:3.6s;animation-delay:-2.0s" /><circle class="star" cx="820" cy="50" r="1.3" style="animation-duration:2.8s;animation-delay:-0.7s" /><circle class="star" cx="940" cy="100" r="1.3" style="animation-duration:3.3s;animation-delay:-1.6s" /><circle class="star" cx="1060" cy="35" r="1.3" style="animation-duration:2.6s;animation-delay:-0.2s" /><circle class="star" cx="500" cy="70" r="1.3" style="animation-duration:3.9s;animation-delay:-2.4s" /><circle class="star" cx="700" cy="25" r="1.3" style="animation-duration:2.2s;animation-delay:-1.3s" />
  <g class="glow">
    <path d="M300,120 L900,120 L700,0 L500,0 Z" fill="url(#cone)" filter="url(#soft)" />
  </g>
  <g class="bar">
    <rect x="300" y="117" width="600" height="6" rx="3" fill="#22d3ee" filter="url(#hard)" />
    <rect x="300" y="119" width="600" height="2" rx="1" fill="#22d3ee" />
  </g>
</svg>
